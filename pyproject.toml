[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.1.0"
description = "Provenance-complete ML audit trail: every prediction traces to a model version, a data version, and its attributions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Thomas Pequegnot" }]

dependencies = [
    # Provenance / storage
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "pyarrow>=17",
    # Direct dependency, not transitive: PyIceberg's default PyArrowFileIO cannot
    # address local files on Windows (the drive letter parses as a URI scheme), so
    # glassbox.catalog pins FsspecFileIO. See docs/pyiceberg-notes.md.
    "fsspec>=2024.6",
    "duckdb>=1.1",
    # Tracking
    "mlflow>=2.16",
    # Modelling
    "scikit-learn>=1.5",
    # Attribution. Not an extra: every served prediction computes its SHAP values
    # before the response is built (serve/service.py), and the service refuses to
    # load a model it cannot explain. An install without shap cannot run
    # `glassbox predict` at all, so shipping it optional made the documented
    # quickstart fail with ModuleNotFoundError.
    "shap>=0.46",
    "numpy>=1.26",
    "pandas>=2.2",
    # Serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    # CLI
    "typer>=0.12",
    "rich>=13.8",
]

[project.optional-dependencies]
# Retained as an empty alias so `pip install -e ".[dev,explain]"` — which the
# README documented for three phases — keeps working. SHAP is a base dependency.
explain = []
automl = ["flaml[automl]>=2.2", "lightgbm>=4.5", "xgboost>=2.1"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
glassbox = "glassbox.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that train models or write many Iceberg snapshots",
    "spike: Phase 0 capability probes against the installed PyIceberg version",
]
