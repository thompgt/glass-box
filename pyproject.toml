[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox"
version = "0.1.0"
description = "Provenance-complete ML audit trail: every prediction traces to a model version, a data version, and its attributions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Thomas Pequegnot" }]

dependencies = [
    # Provenance / storage
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "pyarrow>=17",
    "duckdb>=1.1",
    # Tracking
    "mlflow>=2.16",
    # Modelling
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    # Serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    # CLI
    "typer>=0.12",
    "rich>=13.8",
]

[project.optional-dependencies]
# Installed from Phase 3 onward. Kept separate so Phases 0-2 have a small,
# fast-to-resolve dependency set.
explain = ["shap>=0.46"]
automl = ["flaml[automl]>=2.2", "lightgbm>=4.5", "xgboost>=2.1"]
fairness = ["fairlearn>=0.10"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
glassbox = "glassbox.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that train models or write many Iceberg snapshots",
    "spike: Phase 0 capability probes against the installed PyIceberg version",
]
