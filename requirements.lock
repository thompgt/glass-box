# Pinned environment for Glass Box.
#
# This file is the environment digest (see glassbox.digest.env_digest): its
# SHA-256 is recorded on every model version, and `glassbox reproduce` refuses
# to compare artifacts across a change to it. Bit-exact reproducibility is a
# claim about a specific set of wheels — scikit-learn's solvers and NumPy's
# reductions are not bit-stable across releases — so ">=" ranges in
# pyproject.toml cannot carry it. Those describe what glassbox is compatible
# with; this describes what a recorded artifact was actually built under.
#
# Regenerate after any intentional dependency change, in an environment created
# from `pip install -e ".[dev]"`:
#
#     python -m pip freeze --exclude-editable > requirements.lock
#
# and expect every previously registered model version to stop reproducing
# under strict_env. That is the guard working, not a bug.
