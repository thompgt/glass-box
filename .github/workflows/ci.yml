name: CI

# The fast suite gates every push and pull request; the slow suite — which
# trains real models and writes real Iceberg snapshots — runs nightly. Split
# because ~86 of the tests take minutes rather than seconds, and a gate nobody
# waits for is a gate nobody keeps green.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC daily. Off the hour so this does not queue behind everyone
    # else's midnight cron.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # 3.12, not 3.13: PyIceberg/SHAP wheel coverage, same constraint the project
  # declares in requires-python.
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "ruff>=0.6"
      - run: ruff check src tests scripts

  test:
    name: pytest (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Everything except the model-training suite
        run: pytest -m "not slow" -q --durations=10

  slow:
    name: pytest (slow suite)
    # Trains models and writes many Iceberg snapshots. Nightly, and on demand —
    # not on every push, where its runtime would make the gate useless.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Full suite, slow tests included
        run: pytest -q --durations=20
